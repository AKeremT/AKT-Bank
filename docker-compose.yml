name: akt-bank

services:
  postgres:
    image: postgres:16-alpine
    container_name: akt_bank_postgres
    environment:
      POSTGRES_DB: core_banking_ledger
      POSTGRES_USER: akt
      POSTGRES_PASSWORD: akt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akt -d core_banking_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akt_bank_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/core_banking_ledger
      SPRING_DATASOURCE_USERNAME: akt
      SPRING_DATASOURCE_PASSWORD: akt
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: akt_bank_frontend
    ports:
      - "4200:80"
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:latest
    container_name: akt_bank_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: akt_bank_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./backend/docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

volumes:
  postgres_data:
